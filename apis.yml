aid: netbox-labs
name: NetBox Labs
description: >-
  NetBox Labs is the commercial company behind NetBox, the open-source network
  source-of-truth (DCIM and IPAM) used by network and infrastructure teams to model
  sites, racks, devices, interfaces, IP addresses, prefixes, VLANs, circuits, VPNs,
  and tenancy. It offers NetBox Cloud and NetBox Enterprise alongside the OSS
  project. NetBox exposes a comprehensive token-authenticated REST API (OpenAPI 3.0,
  1,000+ operations across dcim/ipam/circuits/tenancy/virtualization/vpn/wireless),
  a read-only GraphQL API, official Python (pynetbox) and Go (go-netbox) client
  libraries, and an official read-only Model Context Protocol (MCP) server for AI
  agents. The platform is SOC 2 Type II compliant.
