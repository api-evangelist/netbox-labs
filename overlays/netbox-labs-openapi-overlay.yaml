overlay: 1.0.0
info:
  title: API Evangelist enhancements for NetBox REST API
  version: 1.0.0
extends: openapi/netbox-labs-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: netbox-labs
      x-apievangelist-auth: token (Authorization header)
      x-apievangelist-pagination: offset+cursor (limit/offset/start)
      x-apievangelist-mcp: https://github.com/netboxlabs/netbox-mcp-server
  - target: $.servers
    update: []
