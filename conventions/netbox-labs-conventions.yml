  mechanism: etag
  request_header: If-Match
  note: Optimistic concurrency via ETag / If-Match conditional updates (not idempotency-key replay).
versioning:
  header: API-Version
  scheme: major.minor (matches installed NetBox release)
  ref: lifecycle/netbox-labs-lifecycle.yml
idempotency:
  supported: false
  note: No idempotency-key replay header is documented; PUT/PATCH are naturally idempotent, POST is not.
